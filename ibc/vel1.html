<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Velocimeter</title>
    <style>
      .vel {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        font-family: Arial, sans-serif;
      }
      .velocimeter-container {
        text-align: center;
      }
      #velocimeter {
        background-color: #f3f3f3;
        border-radius: 50%;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
      }
      h2 {
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="vel">
      <div class="velocimeter-container">
        <canvas id="velocimeter" width="400" height="400"></canvas>
        <h2>Current Speed: <span id="current-value">1000</span></h2>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('velocimeter');
      const ctx = canvas.getContext('2d');

      const minValue = 0;
      const maxValue = 200000; // max value 200,000.00
      const currentValue = 1000; // initial value
      const gaugeRadius = 180; // Radius for the gauge

      const currentDisplay = document.getElementById('current-value');

      // Draw the gauge background and ticks
      function drawGaugeBackground() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw the arc for the gauge
        ctx.beginPath();
        ctx.arc(200, 200, gaugeRadius, Math.PI, 2 * Math.PI);
        ctx.strokeStyle = '#ddd';
        ctx.lineWidth = 15;
        ctx.stroke();
        ctx.closePath();

        // Draw ticks
        const totalTicks = 10;
        for (let i = 0; i <= totalTicks; i++) {
          const angle = Math.PI + (i / totalTicks) * Math.PI;
          const x1 = 200 + Math.cos(angle) * gaugeRadius;
          const y1 = 200 + Math.sin(angle) * gaugeRadius;
          const x2 = 200 + Math.cos(angle) * (gaugeRadius - 20);
          const y2 = 200 + Math.sin(angle) * (gaugeRadius - 20);

          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.strokeStyle = '#000';
          ctx.lineWidth = 3;
          ctx.stroke();
        }
      }

      // Draw the needle
      function drawNeedle(value) {
        const angle = Math.PI + (value / maxValue) * Math.PI; // Calculate needle angle
        const needleLength = gaugeRadius - 40; // Needle length
        const x = 200 + Math.cos(angle) * needleLength;
        const y = 200 + Math.sin(angle) * needleLength;

        // Draw needle
        ctx.beginPath();
        ctx.moveTo(200, 200); // Needle center point
        ctx.lineTo(x, y); // Needle tip
        ctx.strokeStyle = 'red';
        ctx.lineWidth = 5;
        ctx.stroke();
      }

      // Animate the needle
      function animateNeedle(fromValue, toValue, duration) {
        const startTime = performance.now();
        function animate(time) {
          const elapsed = time - startTime;
          const progress = Math.min(elapsed / duration, 1); // Ensure progress never exceeds 1
          const currentValue = fromValue + (toValue - fromValue) * progress;

          drawGaugeBackground();
          drawNeedle(currentValue);
          currentDisplay.textContent = Math.floor(currentValue); // Update the display value

          if (progress < 1) {
            requestAnimationFrame(animate);
          }
        }
        requestAnimationFrame(animate);
      }

      // Draw the initial state of the gauge and start the animation
      window.onload = function () {
        drawGaugeBackground();
        animateNeedle(minValue, currentValue, 1500); // Animate from minValue to currentValue over 1.5 seconds
      };
    </script>
  </body>
</html>
